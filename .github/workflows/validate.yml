name: Validate documentation and local lab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar links e blocos Markdown
        run: python3 tests/check_docs.py
      - name: Validar contrato TerraformStack e manifests
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML jsonschema
          python3 -m unittest discover -s tests -p 'test_terraformstack_contract.py'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Testar TerraformStack Controller
        working-directory: control-plane/terraformstack/controller
        run: |
          go mod tidy
          go test -race ./...
          go vet ./...
          go build ./cmd
      - name: Testar controller com API Kubernetes (envtest)
        working-directory: control-plane/terraformstack/controller
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.21
          export KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.21 use 1.33.x -p path)"
          go test -race -count=1 ./internal/controller -run TestEnvtest
      - name: Validar utilitários de identidade e state
        run: |
          python3 -m py_compile \
            foundation/scripts/bootstrap-workflow-credentials.py \
            foundation/scripts/prepare-state-backend.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          job = yaml.safe_load(Path("foundation/iam/executor/verify-uat-executor-job.yaml").read_text())
          assert job["kind"] == "Job"
          assert job["metadata"]["namespace"] == "argo-workflows"
          pod = job["spec"]["template"]["spec"]
          assert pod["containers"][0]["envFrom"][0]["secretRef"]["name"] == "terraform-executor-bootstrap"
          assert pod["volumes"][0]["configMap"]["name"] == "terraform-executor-aws-config"
          PY
      - name: Instalar Terraform para validar o Simulator
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Validar Configuration e o Simulator
        run: |
          terraform fmt -diff -check -recursive foundation/modules/configuration foundation/stacks/simulator
          terraform -chdir=foundation/modules/configuration init -backend=false -input=false
          terraform -chdir=foundation/modules/configuration test -no-color
          terraform -chdir=foundation/stacks/simulator init -backend=false -input=false
          terraform -chdir=foundation/stacks/simulator validate -no-color
          terraform -chdir=foundation/stacks/simulator test -no-color
      - name: Validar sintaxe dos scripts bash
        run: |
          for file in platform/hub/scripts/*.sh workflow-plane/argo-workflows/terraformstack/pipeline.sh foundation/stacks/simulator/verify.sh; do
            bash -n "$file"
          done
      - name: Validar YAML de exemplo e kind
        run: |
          python3 - <<'PY'
          from pathlib import Path
          configs = [
              Path("platform/hub/kind-config.yaml"),
              Path("platform/hub/namespaces.yaml"),
              Path("platform/hub/traefik/values.yaml"),
              Path("platform/hub/traefik/demo.yaml"),
              Path("platform/hub/traefik/chart-version.txt"),
              Path("foundation/environment.example.yaml"),
          ]
          for config in configs:
              assert config.is_file() and config.read_text(encoding="utf-8").strip(), f"Configuração ausente ou vazia: {config}"
          print("Configurações de laboratório presentes.")
          PY
