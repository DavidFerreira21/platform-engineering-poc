name: Validate documentation and local lab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar links e blocos Markdown
        run: python3 tests/check_docs.py
      - name: Validar sintaxe dos scripts bash
        run: bash -n platform/hub/scripts/create.sh platform/hub/scripts/verify.sh platform/hub/scripts/delete.sh
      - name: Validar YAML de exemplo e kind
        run: |
          python3 - <<'PY'
          from pathlib import Path
          configs = [
              Path("platform/hub/kind-config.yaml"),
              Path("foundation/config/entity-a/uat/environment.example.yaml"),
          ]
          for config in configs:
              assert config.is_file() and config.read_text(encoding="utf-8").strip()
          print("Configurações de laboratório presentes.")
          PY
