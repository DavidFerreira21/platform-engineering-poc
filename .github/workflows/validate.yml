name: Validate documentation and local lab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar links e blocos Markdown
        run: python3 tests/check_docs.py
      - name: Validar contrato TerraformStack e manifests
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML jsonschema
          python3 -m unittest discover -s tests -p 'test_terraformstack_contract.py'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verificar formatação e dependências Go
        working-directory: control-plane/terraformstack/controller
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Arquivos precisam de gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          go mod tidy -diff
      - name: Testar TerraformStack Controller
        working-directory: control-plane/terraformstack/controller
        run: |
          go test -race ./...
          go vet ./...
          go build -mod=readonly -o /tmp/terraformstack-controller ./cmd
      - name: Testar controller com API Kubernetes (envtest)
        working-directory: control-plane/terraformstack/controller
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.21
          assets="$("$(go env GOPATH)/bin/setup-envtest" use 1.33.x -p path)"
          test -x "$assets/kube-apiserver"
          test -x "$assets/etcd"
          export KUBEBUILDER_ASSETS="$assets"
          go test -race -count=1 ./internal/controller -run TestEnvtest
      - name: Validar utilitários de state e publicação
        run: |
          python3 -m py_compile \
            foundation/scripts/prepare-state-backend.py \
            foundation/scripts/publish-bridge-outputs.py
      - name: Instalar Terraform para validar o Simulator
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Validar Configuration e o Simulator
        run: |
          terraform fmt -diff -check -recursive foundation/modules/configuration foundation/stacks/simulator
          terraform -chdir=foundation/modules/configuration init -backend=false -input=false
          terraform -chdir=foundation/modules/configuration test -no-color
          terraform -chdir=foundation/stacks/simulator init -backend=false -input=false
          terraform -chdir=foundation/stacks/simulator validate -no-color
          terraform -chdir=foundation/stacks/simulator test -no-color
      - name: Validar sintaxe dos scripts bash
        run: |
          for file in workflow-plane/argo-workflows/terraformstack/pipeline.sh foundation/stacks/simulator/verify.sh; do
            bash -n "$file"
          done
      - name: Validar registro de Environment de exemplo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          environment = yaml.safe_load(Path("foundation/environment.example.yaml").read_text())
          assert environment["entity"] and environment["environment"]
          assert environment["aws"]["region"]
          PY
