# Executar apenas após bootstrap-workflow-credentials.py prepare.
# O AWS CLI assume a role UAT usando credential_source=Environment (STS).
apiVersion: batch/v1
kind: Job
metadata:
  name: terraform-executor-identity-check
  namespace: argo-workflows
  labels:
    app.kubernetes.io/part-of: terraformstack-executor
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: aws-sts
          image: public.ecr.aws/aws-cli/aws-cli:latest
          command: ["aws"]
          args:
            - "--profile"
            - "uat-executor"
            - "sts"
            - "get-caller-identity"
            - "--output"
            - "json"
          env:
            - name: AWS_CONFIG_FILE
              value: /etc/aws/config
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          envFrom:
            - secretRef:
                name: terraform-executor-bootstrap
          volumeMounts:
            - name: aws-config
              mountPath: /etc/aws
              readOnly: true
      volumes:
        - name: aws-config
          configMap:
            name: terraform-executor-aws-config
            defaultMode: 0444
