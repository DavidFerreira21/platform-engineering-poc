apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kustomize empacota apenas políticas de produção, nunca os testes.
configMapGenerator:
  - name: terraformstack-policy
    files:
      - decision.rego=engine/decision.rego
      - common.rego=modules/common/policy.rego
      - simulator.rego=modules/simulator/policy.rego
      - profiles.yaml=profiles/profiles.yaml
generatorOptions:
  immutable: true
