apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: lab08-terraform-executor-check
  namespace: argo-workflows
spec:
  entrypoint: validate
  serviceAccountName: argo-workflow
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  activeDeadlineSeconds: 900
  arguments:
    parameters:
      - name: bucket
      - name: account
      - name: region
      - name: entity
        value: entity-a
      - name: environment
        value: uat
      - name: stack
        value: network
  templates:
    - name: validate
      container:
        image: terraformstack-executor:lab08
        imagePullPolicy: Never
        args:
          - "--bucket={{workflow.parameters.bucket}}"
          - "--account={{workflow.parameters.account}}"
          - "--region={{workflow.parameters.region}}"
          - "--entity={{workflow.parameters.entity}}"
          - "--environment={{workflow.parameters.environment}}"
          - "--stack={{workflow.parameters.stack}}"
        env:
          - name: AWS_CONFIG_FILE
            value: /etc/aws/config
        envFrom:
          - secretRef:
              name: terraform-executor-bootstrap
        volumeMounts:
          - name: aws-config
            mountPath: /etc/aws
            readOnly: true
          - name: work
            mountPath: /workspace
          - name: home
            mountPath: /home/executor
          - name: tmp
            mountPath: /tmp
        securityContext:
          runAsUser: 10001
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
      volumes:
        - name: aws-config
          configMap:
            name: terraform-executor-aws-config
        - name: work
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
