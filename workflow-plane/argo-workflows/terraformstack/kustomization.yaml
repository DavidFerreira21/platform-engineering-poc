apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-workflows
resources:
  - workflowtemplate.yaml
  - rbac.yaml
  - ../../policy-engine
configurations:
  - names.yaml
configMapGenerator:
  - name: terraformstack-scripts
    files: [pipeline.sh]
  - name: terraformstack-simulator-profile
    files: [simulator.json]
generatorOptions:
  immutable: true
