apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-workflows
resources:
  - workflowtemplate.yaml
  - rbac.yaml
configurations:
  - names.yaml
configMapGenerator:
  - name: terraformstack-scripts
    files: [pipeline.sh]
  - name: terraformstack-policy
    files: [policy.rego]
generatorOptions:
  immutable: true
