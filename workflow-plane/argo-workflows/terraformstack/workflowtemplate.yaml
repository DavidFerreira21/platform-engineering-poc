apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: terraformstack
  namespace: argo-workflows
spec:
  entrypoint: reconcile
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    fsGroup: 10001
  arguments:
    parameters:
      - name: intent
  volumes:
    - name: scripts
      configMap:
        name: terraformstack-scripts
    - name: policy
      configMap:
        name: terraformstack-policy
    - name: profile
      configMap:
        name: terraformstack-simulator-profile
  templates:
    - name: reconcile
      steps:
        - - {name: resolve, template: resolve}
        - - name: prepare
            template: prepare
            when: '{{steps.resolve.outputs.parameters.allowed}} == true'
        - - name: execute
            template: execute
            when: "{{=steps.resolve.outputs.parameters.allowed == 'true' && steps.prepare.outputs.parameters.allowed == 'true'}}"
        - - name: cleanup
            template: cleanup
            continueOn: {failed: true, error: true}
            when: "{{=steps.prepare.status == 'Succeeded' && steps.prepare.outputs.parameters.allowed == 'true'}}"
    - name: execute
      steps:
        - - {name: init, template: init}
        - - {name: validate, template: validate}
        - - {name: plan, template: plan}
        - - name: opa
            template: opa
            continueOn: {failed: true, error: true}
        - - name: decision
            template: decision
            arguments:
              parameters:
                - name: result
                  value: "{{=steps.opa.status == 'Succeeded' ? steps.opa.outputs.result : ''}}"
                - {name: plan-hash, value: '{{steps.plan.outputs.parameters.plan-hash}}'}
                - {name: document-hash, value: '{{steps.plan.outputs.parameters.document-hash}}'}
                - {name: context-hash, value: '{{steps.plan.outputs.parameters.context-hash}}'}
                - {name: plan-exit, value: '{{steps.plan.outputs.parameters.plan-exit}}'}
        - - name: approval
            template: approval
            when: '{{steps.decision.outputs.parameters.decision}} == RequireApproval'
        - - name: authorize
            template: authorize
            arguments:
              parameters:
                - {name: decision, value: '{{steps.decision.outputs.parameters.decision}}'}
                - {name: plan-hash, value: '{{steps.plan.outputs.parameters.plan-hash}}'}
                - name: approval
                  value: "{{=steps.decision.outputs.parameters.decision == 'RequireApproval' ? steps.approval.outputs.parameters.approval : 'Reject'}}"
                - name: approved-hash
                  value: "{{=steps.decision.outputs.parameters.decision == 'RequireApproval' ? steps.approval.outputs.parameters['approved-hash'] : 'unconfirmed'}}"
        - - name: apply
            template: apply
            when: "{{=steps.authorize.outputs.parameters['apply-request'] != 'none'}}"
            arguments:
              parameters:
                - {name: plan-hash, value: '{{steps.plan.outputs.parameters.plan-hash}}'}
        - - name: verify
            template: verify
            when: "{{=steps.authorize.outputs.parameters['apply-request'] != 'none'}}"
    - name: resolve
      activeDeadlineSeconds: 90
      container:
        image: terraformstack-runner:local
        imagePullPolicy: IfNotPresent
        command: [bash, /platform/scripts/pipeline.sh]
        args: [resolve]
        env:
          - {name: INTENT, value: '{{workflow.parameters.intent}}'}
          - {name: WORKFLOW, value: '{{workflow.name}}'}
        volumeMounts:
          - {name: scripts, mountPath: /platform/scripts, readOnly: true}
          - {name: profile, mountPath: /platform/profile, readOnly: true}
        securityContext: &restricted
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
      outputs:
        parameters:
          - {name: allowed, valueFrom: {path: /tmp/allowed}}
          - {name: execution-context, globalName: execution-context, valueFrom: {path: /tmp/execution-context}}
          - {name: execution-volume, globalName: execution-volume, valueFrom: {path: /tmp/execution-volume}}
          - {name: execution-result, globalName: execution-result, valueFrom: {path: /tmp/execution-result}}
    - name: prepare
      volumes: &state
        - name: state
          persistentVolumeClaim:
            claimName: '{{workflow.outputs.parameters.execution-volume}}'
      activeDeadlineSeconds: 300
      container:
        <<: &runner
          image: terraformstack-runner:local
          imagePullPolicy: IfNotPresent
          command: [bash, /platform/scripts/pipeline.sh]
          env:
            - {name: INTENT, value: '{{workflow.parameters.intent}}'}
            - {name: WORKFLOW, value: '{{workflow.name}}'}
            - {name: EXECUTION_CONTEXT, value: '{{workflow.outputs.parameters.execution-context}}'}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: scripts, mountPath: /platform/scripts, readOnly: true}
            - {name: policy, mountPath: /platform/policy, readOnly: true}
          securityContext: *restricted
        args: [prepare]
      outputs:
        parameters:
          - {name: allowed, valueFrom: {path: /tmp/allowed}}
          - {name: resolved-source, globalName: resolved-source, valueFrom: {path: /tmp/resolved-source}}
          - {name: execution-result, globalName: execution-result, valueFrom: {path: /tmp/execution-result}}
    - name: init
      volumes: *state
      activeDeadlineSeconds: 300
      container:
        <<: *runner
        args: [init]
    - name: validate
      volumes: *state
      activeDeadlineSeconds: 300
      container:
        <<: *runner
        args: [validate]
    - name: plan
      volumes: *state
      activeDeadlineSeconds: 300
      container:
        <<: *runner
        args: [plan]
      outputs:
        parameters:
          - {name: plan-hash, valueFrom: {path: /tmp/plan-hash}}
          - {name: document-hash, valueFrom: {path: /tmp/document-hash}}
          - {name: context-hash, valueFrom: {path: /tmp/context-hash}}
          - {name: plan-exit, valueFrom: {path: /tmp/plan-exit}}
    - name: opa
      volumes: *state
      activeDeadlineSeconds: 60
      container:
        image: openpolicyagent/opa:1.11.0-static
        command: [/opa]
        # O ConfigMap expõe as mesmas regras em entradas visíveis e em ..data.
        args:
          - eval
          - --fail
          - --format=raw
          - --ignore
          - '..*'
          - --data
          - /platform/policy
          - --input
          - '/state/{{workflow.name}}/policy-input.json'
          - data.terraformstack.decision
        volumeMounts:
          - {name: policy, mountPath: /platform/policy, readOnly: true}
          - {name: state, mountPath: /state, readOnly: true}
        securityContext: *restricted
    - name: decision
      volumes: *state
      activeDeadlineSeconds: 60
      inputs:
        parameters:
          - {name: result}
          - {name: plan-hash}
          - {name: document-hash}
          - {name: context-hash}
          - {name: plan-exit}
      container:
        <<: *runner
        args: [decision]
        env:
          - {name: INTENT, value: '{{workflow.parameters.intent}}'}
          - {name: WORKFLOW, value: '{{workflow.name}}'}
          - {name: EXECUTION_CONTEXT, value: '{{workflow.outputs.parameters.execution-context}}'}
          - {name: POLICY_RESULT, value: '{{inputs.parameters.result}}'}
          - {name: PLAN_HASH, value: '{{inputs.parameters.plan-hash}}'}
          - {name: DOCUMENT_HASH, value: '{{inputs.parameters.document-hash}}'}
          - {name: CONTEXT_HASH, value: '{{inputs.parameters.context-hash}}'}
          - {name: PLAN_EXIT, value: '{{inputs.parameters.plan-exit}}'}
      outputs:
        parameters:
          - {name: decision, valueFrom: {path: /tmp/decision}}
          - {name: execution-state, globalName: execution-state, valueFrom: {path: /tmp/execution-state}}
    - name: approval
      suspend: {}
      inputs:
        parameters:
          - name: approval
            default: Reject
            enum: [Reject, Approve]
          - name: approved-hash
            default: unconfirmed
      outputs:
        parameters:
          - name: approval
            valueFrom:
              supplied: {}
              default: Reject
          - name: approved-hash
            valueFrom:
              supplied: {}
              default: unconfirmed
    - name: authorize
      volumes: *state
      activeDeadlineSeconds: 60
      inputs:
        parameters:
          - {name: decision}
          - {name: plan-hash}
          - {name: approval}
          - {name: approved-hash}
      container:
        <<: *runner
        args: [authorize]
        env:
          - {name: INTENT, value: '{{workflow.parameters.intent}}'}
          - {name: WORKFLOW, value: '{{workflow.name}}'}
          - {name: EXECUTION_CONTEXT, value: '{{workflow.outputs.parameters.execution-context}}'}
          - {name: DECISION, value: '{{inputs.parameters.decision}}'}
          - {name: PLAN_HASH, value: '{{inputs.parameters.plan-hash}}'}
          - {name: APPROVAL, value: '{{inputs.parameters.approval}}'}
          - {name: APPROVED_HASH, value: '{{inputs.parameters.approved-hash}}'}
      outputs:
        parameters:
          - {name: apply-request, valueFrom: {path: /tmp/apply-request}}
          - {name: authorization-request, globalName: authorization-request, valueFrom: {path: /tmp/authorization-request}}
          - {name: execution-result, globalName: execution-result, valueFrom: {path: /tmp/execution-result}}
    - name: apply
      volumes: *state
      activeDeadlineSeconds: 300
      inputs:
        parameters:
          - {name: plan-hash}
      container:
        <<: *runner
        args: [apply]
        env:
          - {name: INTENT, value: '{{workflow.parameters.intent}}'}
          - {name: WORKFLOW, value: '{{workflow.name}}'}
          - {name: EXECUTION_CONTEXT, value: '{{workflow.outputs.parameters.execution-context}}'}
          - {name: PLAN_HASH, value: '{{inputs.parameters.plan-hash}}'}
    - name: verify
      volumes: *state
      activeDeadlineSeconds: 300
      container:
        <<: *runner
        args: [verify]
      outputs:
        parameters:
          - {name: execution-result, globalName: execution-result, valueFrom: {path: /tmp/execution-result}}
    - name: cleanup
      volumes: *state
      activeDeadlineSeconds: 60
      container:
        <<: *runner
        args: [cleanup]
