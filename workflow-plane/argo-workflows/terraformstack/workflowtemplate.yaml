apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: terraformstack-plan-simulado
  namespace: argo-workflows
spec:
  entrypoint: plan-simulado
  serviceAccountName: argo-workflow
  activeDeadlineSeconds: 180
  arguments:
    parameters:
      - name: source
      - name: path
      - name: version
      - name: config-version
      - name: entity
      - name: environment
  templates:
    - name: plan-simulado
      container:
        image: docker.io/library/busybox:1.37.0
        command: [echo]
        args:
          - "lab06-plan-simulado: stack={{workflow.parameters.path}} versão={{workflow.parameters.version}} destino={{workflow.parameters.entity}}/{{workflow.parameters.environment}} source={{workflow.parameters.source}} path={{workflow.parameters.path}} config-version={{workflow.parameters.config-version}}"
