apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraformstack-executor
  namespace: argo-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-executor
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-executor
  namespace: argo-workflows
subjects:
  - {kind: ServiceAccount, name: terraformstack-executor, namespace: argo-workflows}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-executor}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-approvers
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows, workflowtemplates, cronworkflows]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [update]
