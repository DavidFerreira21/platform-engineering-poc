crds:
  install: true
  keep: true

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false

extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRouteTCP
    metadata:
      name: argocd-server
      namespace: argocd
    spec:
      entryPoints: [websecure]
      routes:
        - match: HostSNI(`argocd.localhost`)
          services:
            - name: argocd-server
              port: 443
      tls:
        passthrough: true

dex:
  enabled: false
notifications:
  enabled: false
