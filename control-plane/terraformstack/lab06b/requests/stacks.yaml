apiVersion: platform.example.io/v1alpha1
kind: TerraformStack
metadata:
  name: lab06b-network
  namespace: platform-system
spec:
  sourceRef:
    name: foundation-stacks
    path: foundation/lab06b/network
  target:
    entity: entity-a
    environment: uat
  reconciliation:
    driftCheckInterval: 45s
    retryPolicy:
      strategy: Fixed
      interval: 10s
      maxRetries: 1
---
apiVersion: platform.example.io/v1alpha1
kind: TerraformStack
metadata:
  name: lab06b-dependent
  namespace: platform-system
spec:
  sourceRef:
    name: foundation-stacks
    path: foundation/lab06b/network
  target:
    entity: entity-a
    environment: uat
  suspend: true
  dependsOn:
    - name: lab06b-network
  reconciliation:
    retryPolicy:
      strategy: None
