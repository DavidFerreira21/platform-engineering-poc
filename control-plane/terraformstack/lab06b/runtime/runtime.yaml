apiVersion: v1
kind: Namespace
metadata:
  name: terraformstack-lab06b
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraformstack-local-controller
  namespace: platform-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraformstack-local-executor
  namespace: argo-workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraformstack-local-controller
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: terraformstack-local-controller
  template:
    metadata:
      labels:
        app: terraformstack-local-controller
    spec:
      serviceAccountName: terraformstack-local-controller
      containers:
        - name: controller
          image: terraformstack-controller:lab06b
          imagePullPolicy: Never
          command: [python, -u, /app/real.py]
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab06b-network
  namespace: argo-workflows
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab06b-dependent
  namespace: argo-workflows
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
