apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: terraformstack-local
  namespace: argo-workflows
spec:
  entrypoint: reconcile
  serviceAccountName: terraformstack-local-executor
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    fsGroup: 10001
  arguments:
    parameters:
      - name: intent
      - name: slot
  volumes:
    - name: state
      persistentVolumeClaim:
        claimName: '{{workflow.parameters.slot}}'
  templates:
    - name: reconcile
      steps:
        - - name: plan
            template: plan
        - - name: approval
            template: approval
            when: '{{steps.plan.outputs.parameters.decision}} == RequireApproval'
        - - name: apply
            template: apply
            when: '{{steps.plan.outputs.parameters.decision}} == AutoApply'
            arguments:
              parameters:
                - name: decision
                  value: AutoApply
                - name: plan-hash
                  value: '{{steps.plan.outputs.parameters.plan-hash}}'
          - name: apply-approved
            template: apply
            when: '{{steps.plan.outputs.parameters.decision}} == RequireApproval'
            arguments:
              parameters:
                - name: decision
                  value: RequireApproval
                - name: plan-hash
                  value: '{{steps.plan.outputs.parameters.plan-hash}}'
                - name: approval
                  value: '{{steps.approval.outputs.parameters.approval}}'
                - name: approved-hash
                  value: '{{steps.approval.outputs.parameters.approved-hash}}'
    - name: plan
      activeDeadlineSeconds: 300
      container:
        image: terraformstack-executor:lab06b
        imagePullPolicy: Never
        command: [python, /app/executor.py]
        args: [plan]
        env:
          - name: INTENT
            value: '{{workflow.parameters.intent}}'
          - name: WORKFLOW
            value: '{{workflow.name}}'
        volumeMounts:
          - name: state
            mountPath: /state
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
      outputs:
        parameters:
          - name: decision-record
            globalName: decision-record
            valueFrom:
              path: /tmp/decision-record
          - name: decision
            valueFrom:
              path: /tmp/decision
          - name: plan-hash
            valueFrom:
              path: /tmp/plan-hash
    - name: approval
      suspend: {}
      inputs:
        parameters:
          - name: approval
            default: Reject
            enum: [Reject, Approve]
          - name: approved-hash
            default: unconfirmed
      outputs:
        parameters:
          - name: approval
            valueFrom:
              supplied: {}
              default: Reject
          - name: approved-hash
            valueFrom:
              supplied: {}
              default: unconfirmed
    - name: apply
      activeDeadlineSeconds: 300
      inputs:
        parameters:
          - name: decision
          - name: plan-hash
          - name: approval
            default: Reject
          - name: approved-hash
            default: unconfirmed
      container:
        image: terraformstack-executor:lab06b
        imagePullPolicy: Never
        command: [python, /app/executor.py]
        args: [apply]
        env:
          - name: INTENT
            value: '{{workflow.parameters.intent}}'
          - name: WORKFLOW
            value: '{{workflow.name}}'
          - name: DECISION
            value: '{{inputs.parameters.decision}}'
          - name: PLAN_HASH
            value: '{{inputs.parameters.plan-hash}}'
          - name: APPROVAL
            value: '{{inputs.parameters.approval}}'
          - name: APPROVED_HASH
            value: '{{inputs.parameters.approved-hash}}'
        volumeMounts:
          - name: state
            mountPath: /state
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
      outputs:
        parameters:
          - name: apply-result
            globalName: apply-result
            valueFrom:
              path: /tmp/apply-result
