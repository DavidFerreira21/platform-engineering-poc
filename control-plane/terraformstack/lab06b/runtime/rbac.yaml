apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-local
  namespace: platform-system
rules:
  - apiGroups: [platform.example.io]
    resources: [terraformstacks]
    resourceNames: [lab06b-network, lab06b-dependent]
    verbs: [get]
  - apiGroups: [platform.example.io]
    resources: [terraformstacks/status]
    resourceNames: [lab06b-network, lab06b-dependent]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-local
  namespace: platform-system
subjects:
  - {kind: ServiceAccount, name: terraformstack-local-controller, namespace: platform-system}
  - {kind: ServiceAccount, name: terraformstack-local-executor, namespace: argo-workflows}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-local}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-local-finalizers
  namespace: platform-system
rules:
  - apiGroups: [platform.example.io]
    resources: [terraformstacks]
    resourceNames: [lab06b-network, lab06b-dependent]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-local-finalizers
  namespace: platform-system
subjects:
  - {kind: ServiceAccount, name: terraformstack-local-controller, namespace: platform-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-local-finalizers}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-local-workflows
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-local-workflows
  namespace: argo-workflows
subjects:
  - {kind: ServiceAccount, name: terraformstack-local-controller, namespace: platform-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-local-workflows}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-local-executor
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-local-executor
  namespace: argo-workflows
subjects:
  - {kind: ServiceAccount, name: terraformstack-local-executor, namespace: argo-workflows}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-local-executor}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-local-configmaps
  namespace: terraformstack-lab06b
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [lab06b-network, lab06b-dependent]
    verbs: [get, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-local-configmaps
  namespace: terraformstack-lab06b
subjects:
  - {kind: ServiceAccount, name: terraformstack-local-executor, namespace: argo-workflows}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-local-configmaps}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-local-approvers
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-local-approvers
  namespace: argo-workflows
subjects:
  - {kind: Group, name: "system:serviceaccounts:terraformstack-lab06b"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-local-approvers}
