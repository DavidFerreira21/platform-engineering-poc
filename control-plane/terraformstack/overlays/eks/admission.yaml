apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: terraformstack-simulator-approval
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [workflows, workflows/status]
  matchConditions:
    - name: aprovador-local
      expression: request.userInfo.username.startsWith('system:serviceaccount:terraformstack-simulator:')
  variables:
    - name: actorLabels
      expression: >-
        ['workflows.argoproj.io/actor', 'workflows.argoproj.io/actor-email',
         'workflows.argoproj.io/actor-preferred-username', 'workflows.argoproj.io/action']
  validations:
    - expression: >-
        request.namespace == 'argo-workflows' &&
        has(oldObject.metadata.labels) &&
        oldObject.metadata.labels['platform.example.io/workflow'] == 'terraformstack' &&
        object.spec == oldObject.spec &&
        (!has(object.metadata.annotations) && !has(oldObject.metadata.annotations) || has(object.metadata.annotations) && has(oldObject.metadata.annotations) && object.metadata.annotations == oldObject.metadata.annotations) &&
        (!has(object.metadata.finalizers) && !has(oldObject.metadata.finalizers) || has(object.metadata.finalizers) && has(oldObject.metadata.finalizers) && object.metadata.finalizers == oldObject.metadata.finalizers)
      message: O aprovador pode somente operar o gate dos Workflows do Simulator.
    - expression: >-
        has(oldObject.status.nodes) && has(object.status.nodes) &&
        oldObject.status.phase == object.status.phase &&
        (!has(oldObject.status.outputs) && !has(object.status.outputs) ||
         has(oldObject.status.outputs) && has(object.status.outputs) &&
         oldObject.status.outputs == object.status.outputs) &&
        oldObject.status.nodes.size() == object.status.nodes.size() &&
        oldObject.status.nodes.all(k, k in object.status.nodes &&
          (object.status.nodes[k] == oldObject.status.nodes[k] ||
           (oldObject.status.nodes[k].type == 'Suspend' &&
            oldObject.status.nodes[k].templateName == 'approval' &&
            oldObject.status.nodes[k].phase == 'Running' &&
            object.status.nodes[k].type == 'Suspend' &&
            object.status.nodes[k].templateName == 'approval' &&
            object.status.nodes[k].inputs == oldObject.status.nodes[k].inputs &&
            object.status.nodes[k].phase in ['Running', 'Succeeded'])))
      message: Somente o passo de aprovação ativo pode mudar.
    - expression: >-
        oldObject.metadata.labels.all(k, k in object.metadata.labels &&
          object.metadata.labels[k] == oldObject.metadata.labels[k] ||
          k in variables.actorLabels) &&
        object.metadata.labels.all(k, k in oldObject.metadata.labels ||
          k in variables.actorLabels)
      message: Os rótulos de identidade do Workflow são imutáveis.
  auditAnnotations:
    - key: aprovador
      valueExpression: request.userInfo.username
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: terraformstack-simulator-approval
spec:
  policyName: terraformstack-simulator-approval
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: terraformstack-simulator-configmaps
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [configmaps]
  matchConditions:
    - name: executor-local
      expression: request.userInfo.username == 'system:serviceaccount:argo-workflows:terraformstack-executor'
  validations:
    - expression: >-
        request.namespace == 'terraformstack-simulator' &&
        object.metadata.name in ['simulator-network', 'simulator-dependent']
      message: O executor pode criar somente os ConfigMaps do Simulator.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: terraformstack-simulator-configmaps
spec:
  policyName: terraformstack-simulator-configmaps
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: terraformstack-execution
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [workflows]
  matchConditions:
    - name: executor-reservado
      expression: >-
        request.namespace == 'argo-workflows' &&
        ((has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'terraformstack-executor') ||
        (has(object.spec.workflowTemplateRef) && object.spec.workflowTemplateRef.name == 'terraformstack'))
  validations:
    - expression: request.userInfo.username == 'system:serviceaccount:platform-system:terraformstack-controller'
      message: Somente o controller pode criar uma execução TerraformStack.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: terraformstack-execution
spec:
  policyName: terraformstack-execution
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: terraformstack-claim
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [platform.example.io]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [terraformstacks/status]
  matchConditions:
    - name: executor-local
      expression: request.userInfo.username == 'system:serviceaccount:argo-workflows:terraformstack-executor'
  validations:
    - expression: >-
        has(oldObject.status.execution) && !has(oldObject.status.claim) && has(object.status.claim) &&
        has(oldObject.status.execution.authorization) && oldObject.status.execution.authorization != '' &&
        (!has(oldObject.status.execution.cancelling) || !oldObject.status.execution.cancelling) &&
        object.status.claim.workflow == oldObject.status.execution.workflow &&
        object.status.claim.intentHash == oldObject.status.execution.intentHash &&
        object.status.claim.authorization == oldObject.status.execution.authorization
      message: O executor só pode registrar o claim vigente autorizado pelo controller.
    - expression: >-
        object.status.execution == oldObject.status.execution &&
        object.status.?observedGeneration == oldObject.status.?observedGeneration &&
        object.status.?conditions == oldObject.status.?conditions &&
        object.status.?result == oldObject.status.?result &&
        object.status.?resolvedSource == oldObject.status.?resolvedSource &&
        object.status.?deletionIntent == oldObject.status.?deletionIntent &&
        object.status.?lastCheckTime == oldObject.status.?lastCheckTime &&
        object.status.?lastDriftTime == oldObject.status.?lastDriftTime &&
        object.status.?driftPending == oldObject.status.?driftPending &&
        object.status.?lastSuccessTime == oldObject.status.?lastSuccessTime
      message: O executor pode alterar somente status.claim.
    - expression: >-
        (!has(object.spec.suspend) || !object.spec.suspend) &&
        oldObject.status.execution.intent.uid == object.metadata.uid &&
        oldObject.status.execution.intent.generation == object.metadata.generation &&
        oldObject.status.execution.intent.deleting == has(object.metadata.deletionTimestamp) &&
        oldObject.status.execution.intent.revisionAnnotation ==
        (has(object.metadata.annotations) && 'platform.example.io/revision' in object.metadata.annotations ?
         object.metadata.annotations['platform.example.io/revision'] : '')
      message: A intenção autorizada precisa corresponder à revisão vigente da stack.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: terraformstack-claim
spec:
  policyName: terraformstack-claim
  validationActions: [Deny, Audit]
