apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kind
  - storageclass.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      namespace: argo-workflows
      name: simulator-(network|dependent)
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: terraformstack-simulator-eks
