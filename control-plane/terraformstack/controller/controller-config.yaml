# Configuração de instalação, sob controle do Platform Team.
# O catálogo autoriza stacks e identidades; o WorkflowTemplate define os steps.
controller:
  stackNamespace: platform-system
  workers: 4
  leaderElection: true
workflow:
  namespace: argo-workflows
  templateRef:
    name: terraformstack
  # Nomes de transporte, não semântica da autorização.
  parameters:
    input:
      intent: intent
      volume: volume
    output:
      decision: decision-record
      authorization: apply-request
      approval: approval-result
      result: apply-result
  # Referências para diagnóstico e identificação do gate humano.
  templates:
    policy: opa
    approval: approval
