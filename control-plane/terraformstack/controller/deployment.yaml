apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraformstack-controller
  namespace: platform-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: terraformstack-controller
  template:
    metadata:
      labels:
        app: terraformstack-controller
    spec:
      serviceAccountName: terraformstack-controller
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: terraformstack-controller:local
          imagePullPolicy: IfNotPresent
          args:
          - "--config=/etc/terraformstack-config/controller-config.yaml"
          - "--zap-encoder=json"
          - "--zap-log-level=info"
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          volumeMounts:
            - name: controller-config
              mountPath: /etc/terraformstack-config
              readOnly: true
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: controller-config
          configMap:
            name: terraformstack-controller-config
