apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraformstack-controller
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: terraformstack-controller
  template:
    metadata:
      labels:
        app: terraformstack-controller
    spec:
      serviceAccountName: terraformstack-controller
      containers:
        - name: controller
          image: terraformstack-controller:local
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: catalog
              mountPath: /etc/terraformstack
              readOnly: true
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: catalog
          configMap:
            name: terraformstack-catalog
