apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraformstack-controller
  namespace: platform-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: terraformstack-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraformstack-controller
    spec:
      serviceAccountName: terraformstack-controller
      containers:
        - name: controller
          image: terraformstack-controller:lab06-v1
          imagePullPolicy: Never
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
