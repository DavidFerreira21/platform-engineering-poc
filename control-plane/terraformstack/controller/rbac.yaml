apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraformstack-controller
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-controller
  namespace: platform-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [terraformstack-controller]
    verbs: [get, update]
  - apiGroups: [platform.example.io]
    resources: [terraformstacks]
    resourceNames: [lab06-network]
    verbs: [get, list, watch]
  - apiGroups: [platform.example.io]
    resources: [terraformstacks/status]
    resourceNames: [lab06-network]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-controller
  namespace: platform-system
subjects:
  - kind: ServiceAccount
    name: terraformstack-controller
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terraformstack-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-controller
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-controller
  namespace: argo-workflows
subjects:
  - kind: ServiceAccount
    name: terraformstack-controller
    namespace: platform-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: terraformstack-controller
