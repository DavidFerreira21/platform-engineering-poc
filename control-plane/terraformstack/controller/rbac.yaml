apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraformstack-controller
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-controller
  namespace: platform-system
rules:
  - apiGroups: [platform.example.io]
    resources: [terraformstacks]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [platform.example.io]
    resources: [terraformstacks/status]
    verbs: [update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-controller
  namespace: platform-system
subjects:
  - {kind: ServiceAccount, name: terraformstack-controller, namespace: platform-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraformstack-controller
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terraformstack-controller
  namespace: argo-workflows
subjects:
  - {kind: ServiceAccount, name: terraformstack-controller, namespace: platform-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: terraformstack-controller}

# Cache de workflows é restrito ao namespace de execução via configuração.
