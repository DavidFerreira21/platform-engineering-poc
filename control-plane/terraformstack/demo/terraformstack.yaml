apiVersion: platform.example.io/v1alpha1
kind: TerraformStack
metadata:
  generateName: lab05-network-
  namespace: platform-system
spec:
  sourceRef:
    name: foundation-stacks
    path: stacks/lab-network
    # Sem version: default "latest". A execução real precisará resolver e fixar a versão.
  target:
    entity: entity-a
    environment: uat
  configuration: {}
  suspend: false
  lifecycle:
    destroy: false
    destroyResourcesOnDeletion: false
