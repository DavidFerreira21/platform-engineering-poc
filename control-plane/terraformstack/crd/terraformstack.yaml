apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: terraformstacks.platform.example.io
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    kind: TerraformStack
    plural: terraformstacks
    singular: terraformstack
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              description: Contrato declarativo de uma stack reconciliada por um executor.
              required: [sourceRef]
              properties:
                workflowRef:
                  type: object
                  description: Nome da integração autorizada pelo Platform Team; ausente utiliza a integração padrão.
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?                  type: object
                  description: Referência cujo acesso e revisão efetiva são resolvidos pelo executor.
                  required: [repository, path]
                  properties:
                    repository:
                      type: string
                      minLength: 1
                      maxLength: 512
                      description: Identificador do repositório interpretado pelo executor.
                    path:
                      type: string
                      minLength: 1
                      maxLength: 512
                      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_./-]*$'
                      description: Caminho da stack validado contra a raiz permitida da fonte, sem traversal.
                      x-kubernetes-validations:
                        - rule: "!self.matches('(^|/)[.]{1,2}(/|$)|//|/$')"
                          message: "sourceRef.path não permite segmentos vazios, . ou .."
                    version:
                      type: string
                      minLength: 1
                      maxLength: 256
                      default: latest
                      description: Versão/tag/ref da stack. Ausente/latest só é permitido depois de resolver e fixar revisão imutável para o Workflow.
                context:
                  type: object
                  description: Pares repassados ao executor e incluídos na identidade da intenção.
                  maxProperties: 32
                  additionalProperties:
                    type: string
                    maxLength: 256
                dependsOn:
                  type: array
                  description: Dependências de TerraformStacks do mesmo namespace, a validar pelo controller.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                suspend:
                  type: boolean
                  default: false
                  description: Interrompe novas reconciliações e checagens; não cancela apply em andamento.
                reconciliation:
                  type: object
                  properties:
                    driftCheckInterval:
                      type: string
                      pattern: '^([0-9]+(s|m|h))+$'
                      description: Intervalo de verificação de drift, não de apply automático.
                    retryPolicy:
                      type: object
                      properties:
                        strategy:
                          type: string
                          enum: [None, Fixed, ExponentialBackoff]
                          default: ExponentialBackoff
                        interval:
                          type: string
                          pattern: '^([0-9]+(s|m|h))+$'
                        maxInterval:
                          type: string
                          pattern: '^([0-9]+(s|m|h))+$'
                        maxRetries:
                          type: integer
                          minimum: 0
                lifecycle:
                  type: object
                  properties:
                    destroy:
                      type: boolean
                      default: false
                      description: Solicita plan -destroy explícito, governado por policy e aprovação humana.
                    destroyResourcesOnDeletion:
                      type: boolean
                      default: false
                      description: Opt-in de intenção de teardown ao excluir CR; nunca autorização implícita.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                execution:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    workflow:
                      type: string
                    phase:
                      type: string
                      enum: [Pending, Running, Waiting, AuthorizationRequested, Applying, Succeeded, Failed, Blocked, Cancelled]
                    intentHash:
                      type: string
                    authorization:
                      type: string
                    cancelling:
                      type: boolean
                    intent:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        uid:
                          type: string
                        generation:
                          type: integer
                          format: int64
                        revisionAnnotation:
                          type: string
                        deleting:
                          type: boolean
                claim:
                  type: object
                  required: [workflow, intentHash, authorization]
                  properties:
                    workflow:
                      type: string
                      maxLength: 253
                    intentHash:
                      type: string
                      pattern: '^[a-f0-9]{64}$'
                    authorization:
                      type: string
                      maxLength: 256
                result:
                  type: object
                  properties:
                    outcome:
                      type: string
                      enum: [NoChanges, Verified, Blocked, Cancelled]
                    reason:
                      type: string
                      maxLength: 96
                    message:
                      type: string
                      maxLength: 512
                    details:
                      type: object
                      maxProperties: 12
                      additionalProperties:
                        type: string
                        maxLength: 160
                deletionIntent:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                lastDriftTime:
                  type: string
                  format: date-time
                lastCheckTime:
                  type: string
                  format: date-time
                resolvedSource:
                  type: object
                  description: Revisão imutável e vínculo do destino confirmados pelo executor.
                  required: [reference, binding]
                  properties:
                    reference:
                      type: string
                      maxLength: 256
                    binding:
                      type: string
                      maxLength: 256
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768

                sourceRef:
                  type: object
                  description: Referência cujo acesso e revisão efetiva são resolvidos pelo executor.
                  required: [repository, path]
                  properties:
                    repository:
                      type: string
                      minLength: 1
                      maxLength: 512
                      description: Identificador do repositório interpretado pelo executor.
                    path:
                      type: string
                      minLength: 1
                      maxLength: 512
                      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_./-]*$'
                      description: Caminho da stack validado contra a raiz permitida da fonte, sem traversal.
                      x-kubernetes-validations:
                        - rule: "!self.matches('(^|/)[.]{1,2}(/|$)|//|/$')"
                          message: "sourceRef.path não permite segmentos vazios, . ou .."
                    version:
                      type: string
                      minLength: 1
                      maxLength: 256
                      default: latest
                      description: Versão/tag/ref da stack. Ausente/latest só é permitido depois de resolver e fixar revisão imutável para o Workflow.
                context:
                  type: object
                  description: Pares repassados ao executor e incluídos na identidade da intenção.
                  maxProperties: 32
                  additionalProperties:
                    type: string
                    maxLength: 256
                dependsOn:
                  type: array
                  description: Dependências de TerraformStacks do mesmo namespace, a validar pelo controller.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                suspend:
                  type: boolean
                  default: false
                  description: Interrompe novas reconciliações e checagens; não cancela apply em andamento.
                reconciliation:
                  type: object
                  properties:
                    driftCheckInterval:
                      type: string
                      pattern: '^([0-9]+(s|m|h))+$'
                      description: Intervalo de verificação de drift, não de apply automático.
                    retryPolicy:
                      type: object
                      properties:
                        strategy:
                          type: string
                          enum: [None, Fixed, ExponentialBackoff]
                          default: ExponentialBackoff
                        interval:
                          type: string
                          pattern: '^([0-9]+(s|m|h))+$'
                        maxInterval:
                          type: string
                          pattern: '^([0-9]+(s|m|h))+$'
                        maxRetries:
                          type: integer
                          minimum: 0
                lifecycle:
                  type: object
                  properties:
                    destroy:
                      type: boolean
                      default: false
                      description: Solicita plan -destroy explícito, governado por policy e aprovação humana.
                    destroyResourcesOnDeletion:
                      type: boolean
                      default: false
                      description: Opt-in de intenção de teardown ao excluir CR; nunca autorização implícita.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                execution:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    workflow:
                      type: string
                    phase:
                      type: string
                      enum: [Pending, Running, Waiting, AuthorizationRequested, Applying, Succeeded, Failed, Blocked, Cancelled]
                    intentHash:
                      type: string
                    authorization:
                      type: string
                    cancelling:
                      type: boolean
                    intent:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        uid:
                          type: string
                        generation:
                          type: integer
                          format: int64
                        revisionAnnotation:
                          type: string
                        deleting:
                          type: boolean
                claim:
                  type: object
                  required: [workflow, intentHash, authorization]
                  properties:
                    workflow:
                      type: string
                      maxLength: 253
                    intentHash:
                      type: string
                      pattern: '^[a-f0-9]{64}$'
                    authorization:
                      type: string
                      maxLength: 256
                result:
                  type: object
                  properties:
                    outcome:
                      type: string
                      enum: [NoChanges, Verified, Blocked, Cancelled]
                    reason:
                      type: string
                      maxLength: 96
                    message:
                      type: string
                      maxLength: 512
                    details:
                      type: object
                      maxProperties: 12
                      additionalProperties:
                        type: string
                        maxLength: 160
                deletionIntent:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                lastDriftTime:
                  type: string
                  format: date-time
                lastCheckTime:
                  type: string
                  format: date-time
                resolvedSource:
                  type: object
                  description: Revisão imutável e vínculo do destino confirmados pelo executor.
                  required: [reference, binding]
                  properties:
                    reference:
                      type: string
                      maxLength: 256
                    binding:
                      type: string
                      maxLength: 256
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
