apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: terraformstacks.platform.example.io
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    kind: TerraformStack
    plural: terraformstacks
    singular: terraformstack
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              description: Contrato declarativo de uma stack; os campos novos são API, não funções de execução já implementadas.
              required: [target, sourceRef]
              additionalProperties: false
              properties:
                sourceRef:
                  type: object
                  description: Referência lógica a uma stack no catálogo aprovado (Git ou Registry), não URL arbitrária.
                  required: [name, path]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: Nome da fonte registrada no catálogo confiável.
                    path:
                      type: string
                      minLength: 1
                      pattern: '^[a-zA-Z0-9][a-zA-Z0-9_./-]*$'
                      description: Caminho da stack validado contra a raiz permitida da fonte, sem traversal.
                      x-kubernetes-validations:
                        - rule: "self.split('/').all(p, p != '.' && p != '..' && p != '')"
                          message: "sourceRef.path não permite segmentos vazios, . ou .." 
                    version:
                      type: string
                      minLength: 1
                      default: latest
                      description: Versão/tag/ref da stack. Ausente/latest só é permitido depois de resolver e fixar revisão imutável para o Workflow.
                target:
                  type: object
                  required: [entity, environment]
                  properties:
                    entity:
                      type: string
                      minLength: 1
                      description: Identificador lógico da Entity.
                    environment:
                      type: string
                      minLength: 1
                      description: Identificador lógico do Environment na Entity.
                configuration:
                  type: object
                  additionalProperties: false
                  description: Versão selecionada dos YAMLs hierárquicos da stack (global → Entity → Environment).
                  properties:
                    version:
                      type: string
                      minLength: 1
                      default: latest
                      description: Versão da configuração. Ausente/latest exige resolução para commit imutável antes de plan.
                dependsOn:
                  type: array
                  description: Dependências de TerraformStacks do mesmo namespace e destino, a validar pelo controller.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                suspend:
                  type: boolean
                  default: false
                  description: Interrompe novas reconciliações e checagens; não cancela apply em andamento.
                reconciliation:
                  type: object
                  properties:
                    driftCheckInterval:
                      type: string
                      pattern: '^([0-9]+(s|m|h))+$'
                      description: Intervalo de verificação de drift, não de apply automático.
                    retryPolicy:
                      type: object
                      properties:
                        strategy:
                          type: string
                          enum: [None, Fixed, ExponentialBackoff]
                          default: ExponentialBackoff
                        interval:
                          type: string
                          pattern: '^([0-9]+(s|m|h))+$'
                        maxInterval:
                          type: string
                          pattern: '^([0-9]+(s|m|h))+$'
                        maxRetries:
                          type: integer
                          minimum: 0
                lifecycle:
                  type: object
                  properties:
                    destroy:
                      type: boolean
                      default: false
                      description: Solicita plan -destroy explícito, governado por policy e aprovação humana.
                    destroyResourcesOnDeletion:
                      type: boolean
                      default: false
                      description: Opt-in de intenção de teardown ao excluir CR; nunca autorização implícita.
                timeout:
                  type: object
                  description: Limites por etapa do executor; não expiram automaticamente aprovação suspensa.
                  properties:
                    plan:
                      type: string
                      pattern: '^([0-9]+(s|m|h))+$'
                    apply:
                      type: string
                      pattern: '^([0-9]+(s|m|h))+$'
                    verify:
                      type: string
                      pattern: '^([0-9]+(s|m|h))+$'
                healthChecks:
                  type: array
                  description: Verificações pós-apply opcionais; tipos e motores serão implementados futuramente.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type, target]
                    properties:
                      name:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum: [TerraformOutput, KubernetesCondition]
                      target:
                        type: string
                        minLength: 1
                      expected:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                execution:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                policy:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                deletionIntent:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                lastDriftTime:
                  type: string
                  format: date-time
                lastCheckTime:
                  type: string
                  format: date-time
                resolvedSource:
                  type: object
                  description: Versões efetivas e artefatos imutáveis usados na execução.
                  properties:
                    name:
                      type: string
                    version:
                      type: string
                    digest:
                      type: string
                    configurationVersion:
                      type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
