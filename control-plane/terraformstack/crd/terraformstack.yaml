apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: terraformstacks.platform.example.io
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    kind: TerraformStack
    plural: terraformstacks
    singular: terraformstack
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [module, target]
              properties:
                module:
                  type: object
                  required: [name, version]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: Nome lógico do módulo Terraform.
                    version:
                      type: string
                      minLength: 1
                      description: Versão do módulo solicitada pela stack.
                target:
                  type: object
                  required: [entity, environment]
                  properties:
                    entity:
                      type: string
                      minLength: 1
                      description: Identificador lógico da Entity.
                    environment:
                      type: string
                      minLength: 1
                      description: Identificador lógico do Environment na Entity.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$'
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
