# Hub local: portas disponíveis SOMENTE na máquina (127.0.0.1).
# kind NodePort 30080/30443 -> host 8080/8443. Não é EKS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-management
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
