# Traefik apenas para desenvolvimento local com kind.
# NodePorts casam com kind-config.yaml (host 8080 -> 30080; 8443 -> 30443).
service:
  type: NodePort
ports:
  web:
    nodePort: 30080
    expose:
      default: true
  websecure:
    nodePort: 30443
    expose:
      default: true
    tls:
      enabled: true
providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: false
  kubernetesGateway:
    enabled: false
ingressRoute:
  dashboard:
    enabled: false
api:
  dashboard: false
