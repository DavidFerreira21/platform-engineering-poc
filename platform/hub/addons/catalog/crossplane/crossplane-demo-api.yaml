apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-demo-api
  namespace: argocd
spec:
  project: platform-crossplane-demo-api
  source:
    repoURL: https://github.com/DavidFerreira21/platform-engineering-poc.git
    targetRevision: main
    path: control-plane/crossplane/demo
    directory:
      include: '{function.yaml,xrd.yaml,composition.yaml}'
  destination:
    server: HUB_EKS_ARN
    namespace: platform-system
