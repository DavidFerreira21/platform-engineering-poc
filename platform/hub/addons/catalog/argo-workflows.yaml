name: argo-workflows
project: platform-workflows
namespace: argo-workflows
source:
  repoURL: https://argoproj.github.io/argo-helm
  chart: argo-workflows
  targetRevision: "2.0.18"
  helm:
    releaseName: argo-workflows
    valuesObject:
      crds:
        install: true
        full: true
      singleNamespace: true
      server:
        enabled: true
        secure: true
        serviceType: ClusterIP
        authModes:
          - client
      extraObjects:
        - apiVersion: traefik.io/v1alpha1
          kind: IngressRouteTCP
          metadata:
            name: argo-workflows-server
            namespace: argo-workflows
          spec:
            entryPoints: [websecure]
            routes:
              - match: HostSNI(`workflows.localhost`)
                services:
                  - name: argo-workflows-server
                    port: 2746
            tls:
              passthrough: true
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: argo-workflows-viewer
            namespace: argo-workflows
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: argo-workflows-viewer
            namespace: argo-workflows
          rules:
            - apiGroups: [argoproj.io]
              resources: [workflows, workflowtemplates, cronworkflows]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [pods/log]
              verbs: [get]
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: argo-workflows-viewer
            namespace: argo-workflows
          subjects:
            - kind: ServiceAccount
              name: argo-workflows-viewer
              namespace: argo-workflows
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: argo-workflows-viewer
      workflow:
        serviceAccount:
          create: true
        rbac:
          create: true
