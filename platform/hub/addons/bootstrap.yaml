apiVersion: v1
kind: Namespace
metadata:
  name: argo-workflows
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-workflows
  namespace: argocd
spec:
  sourceRepos:
    - https://argoproj.github.io/argo-helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argo-workflows
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: traefik.io
      kind: IngressRouteTCP
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-crossplane
  namespace: argocd
spec:
  sourceRepos:
    - https://charts.crossplane.io/stable
  destinations:
    - server: https://kubernetes.default.svc
      namespace: crossplane-system
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-terraformstack-crd
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/DavidFerreira21/platform-engineering-poc.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: platform-system
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: https://github.com/DavidFerreira21/platform-engineering-poc.git
        revision: main
        files:
          - path: platform/hub/addons/catalog/*.yaml
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: '{{ .project }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
  templatePatch: |
    spec:
      source: {{ .source | toJson }}
