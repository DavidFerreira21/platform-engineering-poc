apiVersion: v1
kind: Namespace
metadata:
  name: argo-workflows
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-workflows
  namespace: argocd
spec:
  sourceNamespaces: [argocd]
  sourceRepos:
    - https://argoproj.github.io/argo-helm
  destinations:
    - server: HUB_EKS_ARN
      namespace: argo-workflows
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-crossplane
  namespace: argocd
spec:
  sourceNamespaces: [argocd]
  sourceRepos:
    - https://charts.crossplane.io/stable
  destinations:
    - server: HUB_EKS_ARN
      namespace: crossplane-system
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-terraformstack-crd
  namespace: argocd
spec:
  sourceNamespaces: [argocd]
  sourceRepos:
    - https://github.com/DavidFerreira21/platform-engineering-poc.git
  destinations:
    - server: HUB_EKS_ARN
      namespace: platform-system
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-terraformstack-controller
  namespace: argocd
spec:
  sourceNamespaces: [argocd]
  sourceRepos:
    - https://github.com/DavidFerreira21/platform-engineering-poc.git
  destinations:
    - server: HUB_EKS_ARN
      namespace: platform-system
    - server: HUB_EKS_ARN
      namespace: argo-workflows
    - server: HUB_EKS_ARN
      namespace: terraformstack-simulator
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: storage.k8s.io, kind: StorageClass}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding}
  namespaceResourceWhitelist:
    - {group: "", kind: PersistentVolumeClaim}
    - {group: "", kind: ServiceAccount}
    - {group: apps, kind: Deployment}
    - {group: "", kind: ConfigMap}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-terraformstack-workflows
  namespace: argocd
spec:
  sourceNamespaces: [argocd]
  sourceRepos:
    - https://github.com/DavidFerreira21/platform-engineering-poc.git
  destinations:
    - {server: "HUB_EKS_ARN", namespace: argo-workflows}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: ConfigMap}
    - {group: "", kind: ServiceAccount}
    - {group: argoproj.io, kind: WorkflowTemplate}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-terraformstack-simulator
  namespace: argocd
spec:
  sourceNamespaces: [argocd]
  sourceRepos:
    - https://github.com/DavidFerreira21/platform-engineering-poc.git
  destinations:
    - {server: "HUB_EKS_ARN", namespace: platform-system}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: platform.example.io, kind: TerraformStack}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-crossplane-demo-api
  namespace: argocd
spec:
  sourceNamespaces: [argocd]
  sourceRepos:
    - https://github.com/DavidFerreira21/platform-engineering-poc.git
  destinations:
    - {server: "HUB_EKS_ARN", namespace: platform-system}
  clusterResourceWhitelist:
    - {group: pkg.crossplane.io, kind: Function}
    - {group: apiextensions.crossplane.io, kind: CompositeResourceDefinition}
    - {group: apiextensions.crossplane.io, kind: Composition}
  namespaceResourceBlacklist:
    - {group: "*", kind: "*"}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-crossplane-demo
  namespace: argocd
spec:
  sourceNamespaces: [argocd]
  sourceRepos:
    - https://github.com/DavidFerreira21/platform-engineering-poc.git
  destinations:
    - {server: "HUB_EKS_ARN", namespace: platform-system}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: lab.platform.example, kind: LabMessage}
